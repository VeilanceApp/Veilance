<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veilance Local Test Page</title>
  <style>
    body { max-width: 760px; margin: 60px auto; padding: 0 24px; font-family: system-ui, sans-serif; background: #0a1019; color: #edf5ff; }
    button { margin: 6px; padding: 10px 14px; border: 1px solid #31547a; border-radius: 8px; background: #14243a; color: white; cursor: pointer; }
    pre { padding: 16px; border: 1px solid #243b55; border-radius: 10px; background: #080d14; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Veilance test page</h1>
  <p>This page deliberately exercises telemetry APIs so the extension can be tested locally.</p>
  <button id="canvas">Canvas readback</button>
  <button id="audio">Offline audio</button>
  <button id="storage">Storage writes</button>
  <button id="webgl">WebGL renderer</button>
  <button id="network">Third-party request</button>
  <button id="media">Enumerate media devices</button>
  <button id="location">Request location</button>
  <pre id="log">Ready.</pre>
  <script>
    const log = (message) => document.querySelector('#log').textContent += `\n${message}`;

    document.querySelector('#canvas').onclick = () => {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      context.fillText('veilance', 12, 20);
      context.getImageData(0, 0, 32, 32);
      canvas.toDataURL();
      log('Canvas readback complete.');
    };

    document.querySelector('#audio').onclick = async () => {
      const context = new OfflineAudioContext(1, 44100, 44100);
      const oscillator = context.createOscillator();
      oscillator.connect(context.destination);
      oscillator.start(0);
      const rendered = await context.startRendering();
      rendered.getChannelData(0);
      log('Offline audio render complete.');
    };

    document.querySelector('#storage').onclick = async () => {
      localStorage.setItem('veilance-test', String(Date.now()));
      sessionStorage.setItem('veilance-test', 'session');
      indexedDB.open('veilance-test-db', 1);
      const cache = await caches.open('veilance-test-cache');
      await cache.put('/veilance-cache-entry', new Response('test'));
      log('Storage activity complete.');
    };

    document.querySelector('#webgl').onclick = () => {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl');
      if (!gl) return log('WebGL unavailable.');
      const extension = gl.getExtension('WEBGL_debug_renderer_info');
      if (extension) gl.getParameter(extension.UNMASKED_RENDERER_WEBGL);
      gl.getParameter(gl.RENDERER);
      log('WebGL renderer queried.');
    };

    document.querySelector('#network').onclick = () => {
      const image = new Image();
      image.src = `https://example.com/favicon.ico?veilance=${Date.now()}`;
      document.body.appendChild(image);
      log('Third-party image request started.');
    };

    document.querySelector('#media').onclick = async () => {
      try { await navigator.mediaDevices.enumerateDevices(); } catch (error) { log(error.message); }
      log('Media enumeration requested.');
    };

    document.querySelector('#location').onclick = () => {
      navigator.geolocation.getCurrentPosition(
        () => log('Location response received.'),
        (error) => log(`Location request result: ${error.message}`)
      );
    };
  </script>
</body>
</html>
